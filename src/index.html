<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Universal Viewer</title>
        <script type="module" src="./main.ts" defer></script>
    </head>
    <body>
        <main id="viewer" aria-live="polite" hidden>
            <div id="viewer" aria-label="Universal Viewer" hidden></div>
            <section id="message" class="message" hidden>
                <h1>Universal Viewer</h1>
                <p id="message-text"></p>
            </section>
        </main>
        <div id="uv" class="uv"></div>
        <button id="manifest-prev" class="manifest-nav manifest-nav-prev" type="button" aria-label="Previous manifest" hidden>&#8249;</button>
        <button id="manifest-next" class="manifest-nav manifest-nav-next" type="button" aria-label="Next manifest" hidden>&#8250;</button>
    </body>
</html>
